version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: matchfaca-postgres
    restart: unless-stopped
    volumes:
      - matchfaca-pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matchfaca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matchfaca_dev}
      POSTGRES_DB: ${POSTGRES_DB:-matchfaca}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matchfaca}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nextjs:
    build:
      context: .
      dockerfile: apps/nextjs/Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: matchfaca-nextjs
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  auth-proxy:
    build:
      context: .
      dockerfile: apps/auth-proxy/Dockerfile
    container_name: matchfaca-auth-proxy
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  matchfaca-pgdata:
    name: matchfaca-pgdata
